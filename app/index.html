<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Sunset Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <header class="masthead">
    <h1>Neon Sunset Studio</h1>
    <p>Your photos, three panels, one sunset — a cover worth posting.</p>
  </header>

  <section class="controls" aria-label="Cover controls">
    <div class="field">
      <label for="photos">Your photos <span class="hint">up to 3, one per panel — or use the built-in scenes</span></label>
      <input id="photos" type="file" accept="image/*" multiple>
      <button id="fill-all" type="button">One photo for all panels</button>
    </div>

    <div class="field">
      <span class="label">Layout</span>
      <div id="layout-buttons" class="button-row"></div>
    </div>

    <div class="field">
      <label for="caption">Caption</label>
      <input id="caption" type="text" maxlength="40" value="Vice Lights">
      <label for="subcaption">Sub-caption</label>
      <input id="subcaption" type="text" maxlength="60" value="A story in three panels">
    </div>

    <div class="field inline">
      <label for="caption-size">Caption size
        <input id="caption-size" type="range" min="0.06" max="0.16" step="0.01" value="0.11">
      </label>
      <label for="caption-pos">Caption place
        <select id="caption-pos">
          <option value="bottom" selected>Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label for="caption-color">Caption colour
        <select id="caption-color">
          <option value="" selected>Default</option>
          <option value="#ffffff">White</option>
          <option value="#ffd319">Gold</option>
          <option value="#00e5ff">Neon cyan</option>
          <option value="#ff2e88">Neon pink</option>
        </select>
      </label>
    </div>

    <div class="field inline">
      <label for="grade">Colour grade
        <select id="grade"></select>
      </label>
      <label for="frame">Frame
        <select id="frame">
          <option value="white" selected>White</option>
          <option value="neon">Neon</option>
          <option value="none">None</option>
        </select>
      </label>
    </div>

    <div class="field">
      <span class="label">Export size</span>
      <div id="size-radios" class="radio-row"></div>
    </div>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>

    <div class="field">
      <span class="label">Panels — click a panel, then pick its photo, zoom and pan</span>
      <div id="panel-controls"></div>
      <p class="hint">Tip: drag on the preview to pan the selected panel's photo.</p>
    </div>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="preview" width="760" height="428" aria-label="Live cover preview"></canvas>
    <p id="size-note" class="hint"></p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
